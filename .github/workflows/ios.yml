name: Build iOS Framework & App

# Triggers:
#   develop   → Preview build: uploads Simulator + Device frameworks
#   main      → Stable build:  uploads Simulator + Device frameworks
#   feature/* PRs → Validation only (must pass before merging to develop)
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          # Skiko is pinned to a complete artifact in shared/build.gradle.kts;
          # keep the normal Gradle cache enabled for the remaining dependencies.

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test shared money and native Room storage
        run: |
          export TAKAKOI_TEST_SIMULATOR_ID="$(xcrun simctl create TakaKoi-CI-Tests com.apple.CoreSimulator.SimDeviceType.iPhone-16)"
          trap 'xcrun simctl shutdown "$TAKAKOI_TEST_SIMULATOR_ID" || true; xcrun simctl delete "$TAKAKOI_TEST_SIMULATOR_ID"' EXIT
          xcrun simctl boot "$TAKAKOI_TEST_SIMULATOR_ID"
          xcrun simctl bootstatus "$TAKAKOI_TEST_SIMULATOR_ID" -b
          ./gradlew :shared:iosSimulatorArm64Test --no-configuration-cache --stacktrace

      - name: Upload shared test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TakaKoi-iOS-Test-Results
          path: shared/build/reports/tests/iosSimulatorArm64Test/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build KMP shared iOS framework — Simulator (iosSimulatorArm64)
        run: |
          ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64 \
            --no-configuration-cache \
            --stacktrace

      - name: Build KMP shared iOS framework — Device (iosArm64)
        run: |
          ./gradlew :shared:linkReleaseFrameworkIosArm64 \
            --no-configuration-cache \
            --stacktrace

      - name: Build iOS App Container (xcodebuild)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            OVERRIDE_KMP_BUILD=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      # develop → Preview frameworks
      - name: Upload Preview iOS Simulator Framework (develop)
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: TakaKoi-iOS-Simulator-Framework-Preview
          path: shared/build/bin/iosSimulatorArm64/releaseFramework/
          retention-days: 14

      - name: Upload Preview iOS Device Framework (develop)
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: TakaKoi-iOS-Device-Framework-Preview
          path: shared/build/bin/iosArm64/releaseFramework/
          retention-days: 14

      # main → Stable release frameworks
      - name: Upload Stable iOS Simulator Framework (main)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: TakaKoi-iOS-Simulator-Framework-Stable
          path: shared/build/bin/iosSimulatorArm64/releaseFramework/
          retention-days: 90

      - name: Upload Stable iOS Device Framework (main)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: TakaKoi-iOS-Device-Framework-Stable
          path: shared/build/bin/iosArm64/releaseFramework/
          retention-days: 90
