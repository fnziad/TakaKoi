name: Build Android APK

# Triggers:
#   develop  → Preview debug build: APK uploaded as TakaKoi-Preview-Debug-APK
#   main     → Stable debug validation: APK uploaded as TakaKoi-Stable-Debug-APK
#   feature/* PRs → Validation only (must pass before merging to develop)
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    - name: Generate Debug Keystore if missing
      run: |
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Test cashflow and database preservation
      run: |
        ./gradlew :app:testDebugUnitTest \
          --tests 'com.example.CashflowCalculationsTest' \
          --tests 'com.example.CashflowUnitTest' \
          --tests 'com.example.MoneyTest' \
          --tests 'com.example.DatabaseMigrationTest' \
          --no-configuration-cache --stacktrace

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: TakaKoi-Android-Test-Results
        path: app/build/reports/tests/testDebugUnitTest/
        if-no-files-found: ignore
        retention-days: 14

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-configuration-cache --stacktrace

    # develop branch → Preview build artifact
    - name: Upload Preview APK (develop branch)
      if: github.ref == 'refs/heads/develop'
      uses: actions/upload-artifact@v4
      with:
        name: TakaKoi-Preview-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14

    # main branch → Stable release artifact
    - name: Upload Release APK (main branch)
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: TakaKoi-Stable-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90
